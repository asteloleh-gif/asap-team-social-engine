name: v9.1 tests

on:
  push:
    branches: ["v9.1", "main"]
  pull_request:
    branches: ["main", "launch/recovered-engine-20261005"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/asap_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Build isolated runtime image
        run: docker build --tag asap-team-social-engine:${{ github.event.pull_request.head.sha || github.sha }} .
